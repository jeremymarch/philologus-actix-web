[package]
name = "philologus-axum"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "philologus-axum"
path = "src/main.rs"

[dependencies]
libphilologus = { path = "../libphilologus" }
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = [
    "compression-full",
    "fs",
    "set-header",
    "trace",
] }
unicode-normalization = { version = "0.1.26", default-features = false }
chrono = "0.4.45"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "tls-rustls",
    "any",
    "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
percent-encoding = "2.3.2"
thiserror = "2.0.21"
tantivy = "0.27.0" #0.21.1
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
hoplite_verbs_rs = { git = "https://github.com/jeremymarch/hoplite_verbs_rs", version = "0.5.1" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
urlencoding = "2.1.3"
