[package]
name = "philologus-actix"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "philologus-actix"
path = "src/main.rs"

[dependencies]
libphilologus = { path = "../libphilologus" }
actix-web = { version = "4.17.0" }
actix-files = "0.7.1"
unicode-normalization = { version = "0.1.26", default-features = false }
env_logger = "0.11.11"
chrono = "0.4.45"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "tls-rustls",
    "any",
    "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
percent-encoding = "2.3.2"
thiserror = "2.0.21"
tantivy = "0.27.0" #0.21.1
tracing-actix-web = "0.7.25"
tracing = { version = "0.1.44", features = ["log"] }
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
# polytonic-greek = { git = "https://github.com/jeremymarch/polytonic-greek", version = "0.4.6" }
hoplite_verbs_rs = { git = "https://github.com/jeremymarch/hoplite_verbs_rs", version = "0.5.1" }
# hoplite_verbs_rs = { path = "../hoplite_verbs_rs" }


[dev-dependencies]
actix-rt = "2.15.0"
urlencoding = "2.1.3"
