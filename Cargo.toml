[workspace]
resolver = "2"
members = ["philologus-actix", "libphilologus"]
default-members = [
    "philologus-actix",
] # i.e. which to run by default, else "cargo run -phc-axum --bin hc-axum"

[workspace.package]
version = "2.0.28"
edition = "2024"
authors = ["Jeremy March <jmarch@gradcenter.cuny.edu>"]

[profile.release]
opt-level = 3
lto = true
